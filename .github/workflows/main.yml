name: Validación de HTML

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    name: Validar archivos HTML
    steps:
      - name: 🧩 Obtener el código del repositorio
        uses: actions/checkout@v3

      - name: 🔍 Validar HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: ./
          blacklist: node_modules
          css: true
          log_level: INFO
