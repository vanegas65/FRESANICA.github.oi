1. Validación de HTML
`yaml
name: Validación Web
on: push
jobs:
validar:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- name: Validar HTML
uses: Cyb3r-Jak3/html5validator-action@v7.2.0
with:
root: ./
`
---
2. Sincronización automática entre ramas
`yaml
name: Sincronizar ramas
on:
push:
branches: [desarrollo]
jobs:
crear-pull-request:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
uses: peter-evans/create-pull-request@v5
with:
base: main
branch: desarrollo
title: "Actualización desde desarrollo"
body: "Sincronización automática desde rama desarrollo"
---
3.Linter de css 
`yaml
name: Linter css
on: push
jobs:
lint-js:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- run: npm install eslint -g
- run: eslint scripts/script.js || true

4. Compresión de imágenes
`yaml
name: Optimizar imágenes
on: push
jobs:
optimizar:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- uses: calibre/image-actions@v1
with:
compress: true
formats: jpg,png
`
---
5. Publicación automática con GitHub Pages
`yaml
name: Despliegue automático
on: push
jobs:
deploy:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- uses: actions/configure-pages@v3
- uses: actions/upload-pages-artifact@v2
with:
path: ./
- uses: actions/deploy-pages@v2
